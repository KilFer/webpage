    a { color: inherit; text-decoration: none; }
    .panel {
      max-width: 1160px; margin: 64px auto; min-height: 660px;
      display: flex;
      background: var(--panel);
      border: 1px solid var(--hairline);
      border-radius: 10px;
      overflow: hidden;
    }
    .side {
      width: 246px; flex-shrink: 0;
      border-right: 1px solid var(--hairline);
      padding: 26px 18px;
      display: flex; flex-direction: column; gap: 24px;
    }
    .wordmark { font-size: 0.92rem; font-weight: 400; padding: 0 10px; letter-spacing: 0.01em; }
    .nav { display: flex; flex-direction: column; gap: 2px; }
    .nav-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 10px; border-radius: 6px;
      font-size: 0.88rem; color: var(--muted);
      border-left: 2px solid transparent;
      transition: background-color 150ms ease, color 150ms ease;
    }
    .nav-item:hover { background: rgba(255, 255, 255, 0.03); color: var(--text); }
    .nav-item.is-active { color: var(--text); background: rgba(255, 255, 255, 0.04); border-left-color: var(--accent); }
    .nav-item .count { font-size: 0.78rem; color: var(--muted); }
    .side .foot { margin-top: auto; }
    .side .foot a { display: inline-flex; align-items: center; gap: 7px; padding: 0 10px; font-size: 0.84rem; color: var(--muted); transition: color 150ms ease; }
    .side .foot a:hover { color: var(--accent); }
    .main { flex-grow: 1; padding: 28px 32px 30px; display: flex; flex-direction: column; }
    .main-head { display: flex; align-items: baseline; justify-content: space-between; }
    .main-head h1 { font-weight: 300; font-size: 1.5rem; letter-spacing: -0.01em; }
    .main-head .n { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
    .thead, .trow {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 128px 176px 56px;
      gap: 20px; align-items: center;
    }
    .thead {
      margin-top: 28px; padding-bottom: 12px;
      border-bottom: 1px solid var(--hairline);
      font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
    }
    .trow {
      padding: 18px 0; border-bottom: 1px solid var(--hairline);
      transition: background-color 150ms ease;
    }
    .trow:hover { background: rgba(255, 255, 255, 0.02); }
    .trow .p-name { font-size: 1rem; font-weight: 400; display: flex; align-items: baseline; gap: 8px; }
    .trow .p-name .code { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.06em; }
    .trow .cell { font-size: 0.85rem; color: var(--muted); }
    .status { display: inline-flex; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--text); }
    .status .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .status .dot--live { background: var(--accent); }
    .status .dot--link { background: #5c5c5c; }
    .main .foot-note { margin-top: 20px; font-size: 0.82rem; color: var(--muted); }
